daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;
worker_processes 2;

events { worker_connections 128; }

http {
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;
    keepalive_timeout 15;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;
    js_engine qjs;
    js_import notify from content.js;
    access_log logs/access.log;

    wechat_notify_appid wx0123456789abcdef;
    wechat_notify_token_file fixtures/token;
    wechat_notify_aes_key_file fixtures/aes-key;
    wechatpay_body_max_size 64k;
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    server {
        listen 8888;

        location = /echo {
            wechat_notify_access on;
            echoz_request_body;
        }
        location = /success {
            wechat_notify_access on;
            default_type text/plain;
            echozn "success";
        }
        location = /njs {
            wechat_notify_access on;
            js_content notify.receive;
        }
        location = /proxy {
            wechat_notify_access on;
            proxy_pass http://127.0.0.1:19006;
        }
        location = /spill {
            wechat_notify_access on;
            client_body_buffer_size 1k;
            echoz_request_body;
        }
        location = /bounded {
            wechat_notify_access on;
            wechatpay_body_max_size 128;
            echozn "must-not-pass";
        }
        location = /other {
            wechat_notify_access on;
            wechat_notify_appid wxfedcba9876543210;
            wechat_notify_token_file fixtures/other-token;
            wechat_notify_aes_key_file fixtures/other-key;
            echoz_request_body;
        }
        location /inherit/ {
            wechat_notify_access on;
            location /inherit/on { echoz_request_body; }
            location /inherit/off {
                wechat_notify_access off;
                echozn "off";
            }
        }
        location = /subrequest { js_content notify.subrequest; }
        location = /ordinary { echozn "ordinary"; }
    }
}
