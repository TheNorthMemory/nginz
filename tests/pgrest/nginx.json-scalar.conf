daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log logs/access.log;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;
    subrequest_output_buffer_size 2m;

    js_engine qjs;
    js_path ".";
    js_import scalar from json_scalar_subrequest.js;

    server {
        listen 8888;

        location /rpc/ {
            pgrest_pass "host=127.0.0.1 port=15432 dbname=testdb user=postgres";
            pgrest_json_scalar on;
        }

        location /rpc/scalar_large_ {
            pgrest_pass "host=127.0.0.1 port=15432 dbname=testdb user=postgres";
            pgrest_json_scalar on;
            pgrest_json_scalar_max_size 2m;

            location /rpc/scalar_large_inherited_ {
                pgrest_pass "host=127.0.0.1 port=15432 dbname=testdb user=postgres";
                # Inherit scalar mode and the response bound.
            }

            location /rpc/scalar_large_small_ {
                pgrest_pass "host=127.0.0.1 port=15432 dbname=testdb user=postgres";
                pgrest_json_scalar_max_size 4k;
            }

            location /rpc/scalar_large_minimum_ {
                pgrest_pass "host=127.0.0.1 port=15432 dbname=testdb user=postgres";
                pgrest_json_scalar_max_size 512;
            }

            location /rpc/scalar_large_disabled_ {
                pgrest_pass "host=127.0.0.1 port=15432 dbname=testdb user=postgres";
                pgrest_json_scalar off;
            }
        }

        location /rpc/scalar_wrapped_ {
            pgrest_json_scalar off;
            pgrest_pass "host=127.0.0.1 port=15432 dbname=testdb user=postgres";
            pgrest_json_scalar_max_size 2m;
        }

        location /api/ {
            pgrest_pass "host=127.0.0.1 port=15432 dbname=testdb user=postgres";
            pgrest_json_scalar on;
            pgrest_json_scalar_max_size 2m;
        }

        location /subrequest/ {
            js_content scalar.forward;
        }
    }
}
